name: Invest optional allocation optimizer
on:
  pull_request:
  push:
    branches: ['feat/**']
permissions:
  contents: read
jobs:
  pyportfolioopt-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned optional optimizer
        run: python -m pip install '.[optimization]'
      - name: Run actual optimizer bridge contract
        run: python -m unittest discover -s tests -p 'test_allocation_optimizer_integration.py' -v
