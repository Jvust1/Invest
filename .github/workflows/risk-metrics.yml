name: Invest optional risk metrics crosscheck
on:
  pull_request:
permissions:
  contents: read
jobs:
  upstream-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned optional libraries
        run: python -m pip install '.[risk-metrics]'
      - name: Assert both libraries installed and run real metrics
        run: |
          python -c "import importlib.util; assert all(importlib.util.find_spec(m) for m in ('quantstats', 'empyrical'))"
          python -m unittest discover -s tests -p 'test_risk_metrics_integration.py' -v
