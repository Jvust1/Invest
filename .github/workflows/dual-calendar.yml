name: Invest dual Shanghai calendar
on:
  pull_request:
permissions:
  contents: read
jobs:
  real-calendar-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned optional calendars
        run: python -m pip install '.[calendars]'
      - name: Run two real calendars
        run: |
          python -c "import exchange_calendars, pandas_market_calendars"
          python -m unittest discover -s tests -p 'test_calendar_crosscheck_integration.py' -v
