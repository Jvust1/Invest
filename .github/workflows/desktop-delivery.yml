name: Verified Windows desktop delivery
on:
  push:
    branches: [feat/desktop-delivery-20260925]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-delivery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      DESKTOP_APP: Invest
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyinstaller==6.22.3 playwright
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force delivery/evidence | Out-Null
          python -m pip freeze | Set-Content -Encoding utf8 delivery/evidence/dependencies.txt
      - name: Full source regression tests
        shell: pwsh
        run: |
          python -m pytest tests -ra --junitxml=delivery/evidence/pytest.xml 2>&1 | Tee-Object delivery/evidence/pytest.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build EXE and verify real process, browser, and restart persistence
        shell: pwsh
        run: |
          python tools/build_windows_delivery.py 2>&1 | Tee-Object delivery/evidence/build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Invest-windows-${{ github.sha }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
