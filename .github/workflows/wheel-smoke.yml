name: Invest installed wheel
on:
  pull_request:
  push:
    branches: [main, 'fix/wheel-runtime-assets-*']
permissions:
  contents: read
jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel and install core dependencies
        run: python -m pip wheel . --wheel-dir dist
      - name: Install built distribution
        run: python -m pip install --no-index --find-links dist invest
      - name: Verify isolated installed wheel HTTP flow
        run: python tools/wheel_smoke.py dist
