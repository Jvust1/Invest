name: Invest Optuna fusion

on:
  push:
    branches: [feat/optuna-walkforward-main-20260930]
    paths:
      - "invest/optuna_walkforward.py"
      - "invest/pipeline.py"
      - "invest/research_pipeline.py"
      - "tests/test_research_pipeline.py"
      - "tests/test_pipeline.py"
      - "tests/test_optuna_walkforward.py"
      - "pyproject.toml"
      - "invest/upstream_registry.json"
      - ".github/workflows/optuna-fusion.yml"
  pull_request:
    paths:
      - "invest/optuna_walkforward.py"
      - "invest/pipeline.py"
      - "invest/research_pipeline.py"
      - "tests/test_research_pipeline.py"
      - "tests/test_pipeline.py"
      - "tests/test_optuna_walkforward.py"
      - "pyproject.toml"
      - "invest/upstream_registry.json"
      - ".github/workflows/optuna-fusion.yml"

permissions:
  contents: read

jobs:
  fusion:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install core project
        run: python -m pip install -e ".[optuna]"
      - name: Run Optuna fusion tests
        run: python -m unittest discover -s tests -p test_optuna_walkforward.py -v
      - name: Run research bundle tests
        run: python -m unittest discover -s tests -p test_research_pipeline.py -v
      - name: Run pipeline metric tests
        run: python -m unittest discover -s tests -p test_pipeline.py -v
      - name: Compile adapter
        run: python -m py_compile invest/optuna_walkforward.py
