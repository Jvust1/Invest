name: Invest chat plugin
on:
  push:
    branches: ['feat/chat-mode-plugin-**', main]
  pull_request:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  chat:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[chat,test]'
      - run: python -m unittest discover -s tests -p test_chat_plugin.py -v
      - run: python -m unittest discover -s tests -q
      - run: python -m pytest tests -q
      - run: python -m compileall -q invest tools
