name: Invest tests
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install project
        run: python -m pip install -e '.[chat,test]'
      - name: Standard-library tests
        run: python -m unittest discover -s tests -v
      - name: Pytest functions and integration tests
        run: python -m pytest tests -q
      - name: Compile source
        run: python -m compileall -q invest
