name: Invest optional bt allocation replay
on:
  pull_request:
permissions:
  contents: read
jobs:
  upstream-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned bt dependency
        run: python -m pip install '.[backtest-bt]'
      - name: Assert bt installed and run real portfolio replay
        run: |
          python -c "from importlib.metadata import version; assert version('bt') == '1.2.3'"
          python -m unittest discover -s tests -p 'test_bt_replay_integration.py' -v
