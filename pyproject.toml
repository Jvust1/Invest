[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invest"
version = "0.1.0"
description = "Composable investment research and backtesting toolkit"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "pandas>=1.5", "requests>=2.28", "scipy>=1.9", "scikit-learn>=1.1"]

[project.optional-dependencies]
charts = ["matplotlib==3.10.8"]
mlflow = ["mlflow==3.16.1"]
openbb = ["openbb"]
optuna = ["optuna>=5.0"]
technical = ["ta>=0.11"]
stockstats = ["stockstats>=0.6.5"]
duckdb = ["duckdb>=1.4"]
akshare = ["akshare>=1.18.97"]
calendars = ["pandas-market-calendars>=4.0"]
ccxt = ["ccxt>=4.0"]
exchange = ["exchange-calendars>=4.0"]
finrl = ["finrl>=0.3"]
risk = ["Riskfolio-Lib>=6.0"]
qlib = ["pyqlib>=0.9"]
skfolio = ["skfolio>=1.4"]
vnpy = ["vnpy>=4.0"]
yfinance = ["yfinance>=0.2.40"]
backtest-bt = ["bt==1.2.3"]
risk-metrics = ["quantstats>=0.0.77", "empyrical-reloaded>=0.5.12"]
optimization = ["PyPortfolioOpt>=1.5", "packaging>=23"]
optimization-riskfolio = ["Riskfolio-Lib>=6.0"]
optimization-skfolio = ["skfolio>=1.4"]
optimization-all = ["PyPortfolioOpt>=1.5", "Riskfolio-Lib>=6.0", "skfolio>=1.4", "packaging>=23"]
test = ["pytest>=8", "playwright>=1.40"]
independent-hikyuu = ["hikyuu==2.8.2"]
independent-zipline = ["zipline-reloaded==3.1.1"]

[tool.setuptools.packages.find]
include = ["invest*"]
