[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invest"
version = "0.1.0"
description = "Composable investment research and backtesting toolkit"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "pandas>=1.5", "requests>=2.28", "scipy>=1.9", "scikit-learn>=1.1"]

[project.optional-dependencies]
calendars = ["pandas-market-calendars>=4.0"]
ccxt = ["ccxt>=4.0"]
exchange = ["exchange-calendars>=4.0"]
finrl = ["finrl>=0.3"]
risk = ["Riskfolio-Lib>=6.0"]
qlib = ["pyqlib>=0.9"]
skfolio = ["skfolio>=1.4"]
vnpy = ["vnpy>=4.0"]

[tool.setuptools.packages.find]
include = ["invest*"]
